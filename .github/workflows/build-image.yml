# The library's tests run first; the site image is built only after they pass. The build definition lives in
# RobyRew/platform so it is maintained once for the whole fleet; this repo only says WHEN to build and which
# secret to pass. Library changes rebuild the site too: the site bundles the library from the repo root.
name: Test, build and publish image

on:
  push:
    branches: [main]
    # Version tags are what ChatForge's daily bump installs, so each tag push gets a test run of its own.
    # GitHub does not evaluate path filters for tag pushes.
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.vscode/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The image build runs only the site's check and build. The library's type check (its three tsconfigs) and
  # its vitest suite run here. The real-export tests skip themselves without their environment variables.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      # No dependency lifecycle scripts, as in the Dockerfile's root install.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    # Only main publishes. Pull requests, tag pushes and manual runs on other branches stop after the tests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Declared here, not only in the reusable workflow: a called workflow can only reduce the caller's
    # permissions, never escalate, and pushing to GHCR needs packages: write.
    permissions:
      contents: read
      packages: write
    uses: RobyRew/platform/.github/workflows/build-image.yml@main
    secrets:
      DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
